<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#6C63FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clippings">
<title>Kindle Clippings</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F5F6FA'/%3E%3Crect x='4' y='13' width='24' height='7' fill='%236C63FF'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#main" id="skip-link">Ir para os destaques</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <h1 data-i18n="app.title">Meus destaques</h1>
  </div>

  <div class="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           data-i18n-ph="search.placeholder" data-i18n-label="search.placeholder">
  </div>

  <div class="actions">
    <button class="btn drawer-toggle" id="drawer-toggle" type="button" data-i18n="toggle.books" aria-expanded="false"></button>
    <span class="tip-host">
      <a class="btn" id="nav-shelf" href="shelf.html" data-i18n="nav.shelf" aria-describedby="tip-shelf"></a>
      <span class="tip" id="tip-shelf" role="tooltip" data-i18n="tip.shelf"></span>
    </span>
    <span class="tip-host">
      <button class="btn" id="nav-stats" type="button" data-i18n="nav.stats" aria-describedby="tip-stats"></button>
      <span class="tip" id="tip-stats" role="tooltip" data-i18n="tip.stats"></span>
    </span>
    <span class="tip-host">
      <button class="btn" id="nav-quotes" type="button" data-i18n="nav.quotes" aria-describedby="tip-quotes"></button>
      <span class="tip" id="tip-quotes" role="tooltip" data-i18n="tip.quotes"></span>
    </span>
    <span class="tip-host covers-host">
      <button class="switch" id="toggle-covers" type="button" role="switch" aria-checked="false" aria-describedby="tip-covers">
        <span class="sw-text" data-i18n="switch.covers"></span>
        <span class="sw-track" aria-hidden="true"><span class="sw-thumb"></span></span>
      </button>
      <svg class="covers-ring" id="covers-ring" viewBox="0 0 20 20" hidden aria-hidden="true">
        <circle class="ring-track" cx="10" cy="10" r="8"></circle>
        <circle class="ring-fill" id="covers-ring-fill" cx="10" cy="10" r="8"></circle>
      </svg>
      <span class="tip" id="tip-covers" role="tooltip" data-i18n="tip.covers"></span>
    </span>
    <span class="tip-host">
      <button class="switch" id="toggle-hidden" type="button" role="switch" aria-checked="false" aria-describedby="tip-hidden">
        <span class="sw-text" data-i18n="switch.duplicates"></span>
        <span class="sw-track" aria-hidden="true"><span class="sw-thumb"></span></span>
      </button>
      <span class="tip" id="tip-hidden" role="tooltip" data-i18n="tip.hidden"></span>
    </span>
    <button class="btn icon" id="toggle-theme" type="button" data-i18n-label="toggle.theme">◐</button>
    <button class="btn flag-btn" id="toggle-lang" type="button">
      <img class="flag" id="lang-flag" alt="" width="26" height="18">
    </button>
    <div class="menu" id="export-menu">
      <button class="btn" id="export-btn" type="button" aria-haspopup="true" aria-expanded="false"
              data-i18n="export.menu"></button>
      <ul class="menu-list" id="export-list" hidden>
        <li><button type="button" data-export="md" data-i18n="export.md"></button></li>
        <li><button type="button" data-export="mdBook" data-i18n="export.mdBook"></button></li>
        <li><button type="button" data-export="json" data-i18n="export.json"></button></li>
        <li><button type="button" data-export="csv" data-i18n="export.csv"></button></li>
        <li><button type="button" data-export="txt" data-i18n="export.txt"></button></li>
        <li><button type="button" data-export="anki" data-i18n="export.anki"></button></li>
        <li><button type="button" data-export="obsidian" data-i18n="export.obsidian"></button></li>
      </ul>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Livros"></nav>
  <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
       tabindex="0" data-i18n-label="sidebar.resize"></div>
  <div class="scrim" id="scrim" hidden></div>

  <main class="pane" id="main" tabindex="-1">
    <div class="pane-inner">
      <div class="dropzone" id="dropzone">
        <p class="drop-title" data-i18n="drop.title"></p>
        <p class="drop-hint" data-i18n="drop.hint"></p>
        <label class="btn primary" for="file" data-i18n="drop.button"></label>
        <input type="file" id="file" accept=".txt,text/plain">
        <p class="restore-pending" id="restore-pending" hidden></p>
      </div>

      <section class="book-banner" id="book-banner" hidden></section>
      <div class="sortbar" id="sortbar" hidden>
        <span class="sortbar-label" data-i18n="sort.label"></span>
        <div class="seg" id="sort-seg" role="group">
          <button type="button" data-sort="order"    data-i18n="sort.order"    aria-pressed="true"></button>
          <button type="button" data-sort="dateDesc" data-i18n="sort.dateDesc" aria-pressed="false"></button>
          <button type="button" data-sort="dateAsc"  data-i18n="sort.dateAsc"  aria-pressed="false"></button>
          <button type="button" data-sort="book"     data-i18n="sort.book"     aria-pressed="false"></button>
          <button type="button" data-sort="topic"    data-i18n="sort.topic"    aria-pressed="false"></button>
        </div>
      </div>
      <p class="statline" id="statline" hidden></p>
      <div class="cards" id="cards"></div>
      <p class="empty" id="empty" hidden></p>
      <div class="sentinel" id="sentinel" aria-hidden="true"></div>
      <p class="footer-note" data-i18n="footer.privacy"></p>
    </div>
  </main>
</div>

<div class="modal" id="stats-modal" role="dialog" aria-modal="true" aria-labelledby="stats-title" hidden>
  <div class="modal-card">
    <header class="modal-head">
      <h2 id="stats-title" data-i18n="st.title"></h2>
      <button class="btn icon modal-close" type="button" data-close="stats-modal" aria-label="×">×</button>
    </header>
    <div class="modal-body" id="stats-body"></div>
  </div>
</div>

<div class="modal" id="quotes-modal" role="dialog" aria-modal="true" aria-labelledby="quotes-title" hidden>
  <div class="modal-card">
    <header class="modal-head">
      <h2 id="quotes-title" data-i18n="qc.title"></h2>
      <div class="qc-tools">
        <div class="seg" id="qc-source" role="group">
          <button type="button" data-qc-src="fav" data-i18n="qc.source.fav" aria-pressed="true"></button>
          <button type="button" data-qc-src="all" data-i18n="qc.source.all" aria-pressed="false"></button>
        </div>
        <input id="qc-q" type="search" autocomplete="off" data-i18n-ph="qc.search" data-i18n-label="qc.search">
        <select id="qc-size" data-i18n-label="qc.size"></select>
        <div class="seg" id="qc-themes" role="group">
          <button type="button" data-qc-theme="dark" data-i18n="qc.theme.dark" aria-pressed="true"></button>
          <button type="button" data-qc-theme="light" data-i18n="qc.theme.light" aria-pressed="false"></button>
          <button type="button" data-qc-theme="paper" data-i18n="qc.theme.paper" aria-pressed="false"></button>
        </div>
      </div>
      <button class="btn icon modal-close" type="button" data-close="quotes-modal" aria-label="×">×</button>
    </header>
    <div class="modal-body"><div class="qc-grid" id="quotes-grid"></div></div>
    <footer class="modal-foot" id="quotes-foot"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/topics.js"></script>
<script src="js/parser.js"></script>
<script src="js/dedupe.js"></script>
<script src="js/clean.js"></script>
<script src="js/tags.js"></script>
<script src="js/search.js"></script>
<script src="js/sort.js"></script>
<script src="js/covers.js"></script>
<script src="js/exports.js"></script>
<script src="js/obsidian.js"></script>
<script src="js/favorites.js"></script>
<script src="js/stats.js"></script>
<script src="js/quotecard.js"></script>
<script src="js/modal.js"></script>
<script src="js/statsview.js"></script>
<script src="js/quoteview.js"></script>
<script src="js/cards.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
